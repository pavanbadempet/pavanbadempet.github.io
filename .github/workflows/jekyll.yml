name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Not needed with bundler cache but good for safety
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Setup Bun (Ultra-Fast JS/TS Runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Rust WebAssembly Engine
        run: cargo test --manifest-path rust-wasm-engine/Cargo.toml

      - name: Run Fast Bun Tests (Wasm Benchmark)
        run: bun test tests/wasm_benchmark.test.ts

      - name: Enrich AI Chunks via Bun (Native Zero-Copy I/O)
        run: bun run scripts/enrich-ai-chunks.mjs _site/ai_chunks.json

      - name: Test Site (HTML Proofer)
        run: |
          gem install html-proofer
          htmlproofer ./_site --disable-external --check-html --check-img-http --allow-hash-href
        continue-on-error: true # Warning only initially

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
