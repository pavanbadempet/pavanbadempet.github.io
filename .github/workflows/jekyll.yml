name: Deploy Pure Bun + Rust site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun (Ultra-Fast JS/TS Runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Site with Pure Bun SSG
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify Rust WebAssembly Engine
        run: cargo test --manifest-path rust-wasm-engine/Cargo.toml

      - name: Run Fast Bun Tests (Wasm Benchmark)
        run: bun test tests/wasm_benchmark.test.ts

      - name: Validate Site Integrity with Bun (< 50ms)
        run: bun run scripts/validate-site.ts _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
