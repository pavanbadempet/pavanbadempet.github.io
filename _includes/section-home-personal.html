{% assign content = site.data.home['started-personal'] %}

<!-- Section Started -->
<div class="section started personal" id="section-started">

    <!-- background mask -->
    <div class="video-bg">
        <div class="video-bg-mask"></div>
    </div>

    <!-- started content -->
    <div class="centrize full-width">
        <div class="vertical-center">
            <div class="started-content">
                {% if content.image != '' %}
                <div class="logo" style="background-image: url({{ content.image | relative_url }});"></div>
                {% endif %}
                {% if content.title != '' %}
                <h1 class="h-title">
                    {{ content.title }}
                </h1>
                {% endif %}
                <h2 class="h-subtitle typing-subtitle">
                    {% for item in content.typed %}
                    <p>{{ item }}</p>
                    {% endfor %}
                </h2>
                <span class="typed-subtitle"></span>
            </div>
        </div>
    </div>

</div>

<style>
@media (max-width: 768px) {
    #section-started.section.started.personal {
        height: auto !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        padding: 85px 16px 40px 16px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        box-sizing: border-box !important;
        overflow: visible !important;
    }
    #section-started .centrize,
    #section-started .vertical-center {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        width: 100% !important;
        height: auto !important;
    }
    #section-started .started-content {
        position: relative !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        width: 100% !important;
        max-width: 440px !important;
        margin: 0 auto !important;
        padding: 0 !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        transform: none !important;
    }
    #section-started .started-content .logo {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        margin: 0 auto 20px auto !important;
        width: min(65vw, 200px) !important;
        height: min(65vw, 200px) !important;
        border-radius: 50% !important;
        -webkit-clip-path: none !important;
        clip-path: none !important;
        border: 3px solid #4bffa5 !important;
        background-size: cover !important;
        background-position: center !important;
        box-shadow: 0 0 25px rgba(75, 255, 165, 0.4) !important;
        flex-shrink: 0 !important;
        display: block !important;
    }
    #section-started .started-content .h-title {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 0 16px 0 !important;
        padding: 0 !important;
        font-size: 0.95rem !important;
        line-height: 1.65 !important;
        color: #d0d0d0 !important;
        text-align: center !important;
        font-weight: 400 !important;
    }
    #section-started .started-content .h-subtitle.typing-subtitle {
        display: none !important;
    }
    #section-started .started-content .typed-subtitle {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        width: 100% !important;
        display: block !important;
        margin: 0 auto !important;
        padding: 0 !important;
        font-size: 1.3rem !important;
        line-height: 1.4 !important;
        min-height: 42px !important;
        text-align: center !important;
        color: #ffffff !important;
        font-weight: 700 !important;
    }
    #section-started .started-content .typed-subtitle strong {
        color: #4bffa5 !important;
    }
}
</style>
