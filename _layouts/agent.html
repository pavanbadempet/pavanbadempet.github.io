<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Pavan's AI Agent" }}</title>
  
  {%- include head.html -%}

  <style>
    /* Full Screen Premium Native App Overrides */
    body.agent-layout {
      background-color: #050505;
      color: #fff;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(10px, env(safe-area-inset-top)) 24px 10px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      flex-shrink: 0;
    }

    .agent-header .logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    
    .agent-header .logo span {
      background: linear-gradient(135deg, #20b2aa, #00ffcc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .agent-header a.classic-btn {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .agent-header a.classic-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(75, 255, 165, 0.4);
    }

    .agent-main {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ambient Orb Animation */
    .ambient-orb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70vw;
      height: 70vw;
      max-width: 800px;
      max-height: 800px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0, 255, 204, 0.12) 0%, rgba(0, 136, 255, 0.04) 40%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      animation: breathe 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes breathe {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* --- HYPER-MINIMALIST UI OVERRIDES --- */
    
    /* Remove Overlay Restrictions */
    body.agent-layout .command-palette-overlay {
      position: relative !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      flex: 1 !important;
      min-height: 0 !important;
      background: transparent !important;
      display: flex !important;
      justify-content: center;
      align-items: stretch;
      opacity: 1 !important;
      padding: 0 !important;
      z-index: 10;
    }

    body.agent-layout .command-palette-modal {
      width: 100% !important;
      max-width: 840px !important;
      height: 100% !important;
      max-height: 100% !important;
      transform: none !important;
      opacity: 1 !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 0 20px;
      box-sizing: border-box !important;
      margin: 0 auto;
    }

    /* Hide Clutter */
    body.agent-layout .cp-header, 
    body.agent-layout .cp-ai-toolbar,
    body.agent-layout .cp-footer-meta {
      display: none !important;
    }

    /* Reorder Components: Body -> Chips -> Footer */
    body.agent-layout .cp-body {
      order: 1 !important;
      flex: 1 !important;
      width: 100% !important;
      max-width: 800px !important;
      margin: 0 auto !important;
      padding: 16px 0 10px 0 !important;
      overflow-y: auto !important;
      scrollbar-width: none;
      min-height: 0 !important;
      -webkit-overflow-scrolling: touch;
    }
    
    body.agent-layout #cp-chat-container {
      padding: 4px 0 !important;
    }
    body.agent-layout .cp-body::-webkit-scrollbar { 
      display: none; 
    }
    
    /* Dynamic Chips Container */
    body.agent-layout .agent-chips {
      order: 2 !important;
      width: 100% !important;
      max-width: 800px !important;
      margin: 0 auto !important;
      padding: 4px 0 10px 0 !important;
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
      border: none !important;
      background: transparent !important;
      scrollbar-width: none;
    }

    body.agent-layout .agent-chips::-webkit-scrollbar {
      display: none;
    }

    body.agent-layout .agent-chip {
      background: rgba(255, 255, 255, 0.04) !important;
      color: #e0e0e0;
      border: 1px solid rgba(75, 255, 165, 0.25);
      border-left: 3px solid #4bffa5;
      padding: 10px 16px;
      border-radius: 12px;
      font-family: 'Space Grotesk', 'Inter', sans-serif !important;
      font-size: 0.84rem;
      font-weight: 500;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
      flex: 1 1 calc(50% - 10px);
      min-width: 220px;
      box-sizing: border-box !important;
      white-space: normal !important;
    }

    body.agent-layout .agent-chip:hover {
      background: rgba(75, 255, 165, 0.1) !important;
      border-color: rgba(75, 255, 165, 0.6);
      border-left-color: #4bffa5 !important;
      color: #4bffa5;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(75, 255, 165, 0.18) !important;
    }

    /* Sleek Input Box */
    body.agent-layout .cp-footer {
      order: 3 !important;
      width: 100% !important;
      max-width: 800px !important;
      margin: 0 auto 16px auto !important;
      background: rgba(255, 255, 255, 0.04) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      border-radius: 14px !important;
      padding: 6px 8px 6px 16px !important;
      box-shadow: 0 4px 25px rgba(0,0,0,0.3) !important;
      display: flex !important;
      align-items: center !important;
      box-sizing: border-box !important;
      transition: box-shadow 0.3s ease, border-color 0.3s ease !important;
    }
    
    body.agent-layout .cp-footer:focus-within {
      border-color: rgba(75, 255, 165, 0.5) !important;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(75, 255, 165, 0.2) !important;
    }

    body.agent-layout .cp-composer {
      display: flex !important;
      width: 100% !important;
      background: transparent !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      align-items: center !important;
    }

    body.agent-layout .cp-input-field {
      flex: 1 !important;
      background: transparent !important;
      border: none !important;
      color: #fff !important;
      padding: 8px 0 !important;
      font-size: 16px !important; /* Prevents auto-zoom on iOS */
      outline: none !important;
      font-weight: 400 !important;
    }
    
    body.agent-layout .cp-input-field::placeholder {
      color: rgba(255, 255, 255, 0.35) !important;
      font-size: 0.95rem;
    }

    /* Minimalist Submit Button */
    body.agent-layout .cp-send {
      background: transparent !important;
      color: rgba(255, 255, 255, 0.6) !important;
      border: none !important;
      border-radius: 10px !important;
      width: 38px !important;
      height: 38px !important;
      min-width: 38px !important;
      margin: 0 !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: all 0.2s ease !important;
    }
    
    body.agent-layout .cp-send:hover {
      background: rgba(75, 255, 165, 0.15) !important;
      color: #4bffa5 !important;
    }

    /* Clean Chat Bubbles */
    body.agent-layout .cp-message {
      margin-bottom: 20px !important;
      display: flex !important;
      align-items: flex-start !important;
      gap: 12px !important;
    }
    
    /* Bot Message */
    body.agent-layout .cp-message.bot {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    
    body.agent-layout .cp-message.bot .cp-avatar {
      background: linear-gradient(135deg, rgba(75, 255, 165, 0.1), rgba(0, 255, 204, 0.2)) !important;
      color: #4bffa5 !important;
      border: 1px solid rgba(75, 255, 165, 0.35) !important;
      border-radius: 50% !important;
      width: 34px !important;
      height: 34px !important;
      min-width: 34px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 0 14px rgba(75, 255, 165, 0.25) !important;
      margin-top: 2px !important;
    }
    
    body.agent-layout .cp-message.bot .cp-text {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: 0.98rem !important;
      line-height: 1.65 !important;
      color: #e2e8f0 !important;
    }

    /* User Message */
    body.agent-layout .cp-message.user {
      flex-direction: row-reverse !important;
    }
    
    body.agent-layout .cp-message.user .cp-avatar {
      display: none !important;
    }
    
    body.agent-layout .cp-message.user .cp-text {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 14px 14px 2px 14px !important;
      font-size: 0.95rem !important;
      padding: 10px 16px !important;
      color: #fff !important;
      max-width: 85% !important;
    }
    
    /* Hide the floating trigger button */
    body.agent-layout .cmd-trigger {
      display: none !important;
    }

    /* Seamless Transition Overlay Style */
    #transition-overlay {
      position: fixed;
      bottom: 30px;
      right: 30px;
      left: auto;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #050505;
      z-index: 9999999;
      transform: scale(80);
      transform-origin: center;
      transition: transform 0.65s cubic-bezier(0.1, 0.9, 0.2, 1);
      pointer-events: none;
    }

    /* ========================================================
       MOBILE DEDICATED RESPONSIVENESS (< 768px)
       ======================================================== */
    @media (max-width: 768px) {
      .agent-header {
        padding: max(8px, env(safe-area-inset-top)) 14px 8px 14px !important;
      }
      .agent-header .logo {
        font-size: 1.15rem !important;
      }
      .agent-header a.classic-btn {
        font-size: 0.76rem !important;
        padding: 5px 10px !important;
      }
      body.agent-layout .command-palette-modal {
        padding: 0 12px !important;
      }
      body.agent-layout .cp-body {
        padding: 12px 0 6px 0 !important;
      }
      body.agent-layout .cp-message.bot .cp-text {
        font-size: 0.92rem !important;
        line-height: 1.55 !important;
      }
      body.agent-layout .agent-chips {
        flex-direction: column !important; /* Clean full-width vertical stack */
        gap: 7px !important;
        padding: 4px 0 8px 0 !important;
      }
      body.agent-layout .agent-chip {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 100% !important;
        padding: 10px 14px !important;
        font-size: 0.83rem !important;
        border-radius: 10px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        box-sizing: border-box !important;
      }
      body.agent-layout .agent-chip::after {
        content: "→";
        font-size: 0.95rem;
        color: #4bffa5;
        opacity: 0.8;
        margin-left: 8px;
        flex-shrink: 0;
      }
      body.agent-layout .cp-footer {
        margin: 0 auto max(8px, env(safe-area-inset-bottom)) auto !important;
        padding: 4px 6px 4px 12px !important;
        border-radius: 12px !important;
      }
      body.agent-layout .cp-input-field {
        font-size: 16px !important; /* Prevent iOS zoom */
        padding: 8px 0 !important;
      }
      body.agent-layout .cp-send {
        width: 36px !important;
        height: 36px !important;
        min-width: 36px !important;
      }
      #transition-overlay {
        bottom: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body class="agent-layout">
  <!-- Transition Entry Ripple Overlay -->
  <div id="transition-overlay"></div>

  <header class="agent-header">
    <div class="logo">PAVAN<span>.AI</span></div>
    <a href="{{ '/classic/' | relative_url }}" class="classic-btn">
      <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Classic View
    </a>
  </header>

  <main class="agent-main">
    <canvas id="matrix-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.08;"></canvas>
    <div class="ambient-orb"></div>
    {{ content }}
  </main>

  {%- include scripts.html -%}

  <script>
    // Global function called by command-palette.html after receiving a message
    window.renderDynamicChips = function(suggestions) {
        const container = document.getElementById('cp-agent-chips');
        if (!container) return;
        
        container.innerHTML = ''; // clear old chips
        
        if (!suggestions || suggestions.length === 0) {
            container.style.display = 'none';
            return;
        }
        
        suggestions.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'agent-chip';
            btn.textContent = text;
            btn.addEventListener('click', function() {
                const input = document.getElementById('cp-input');
                const sendBtn = document.getElementById('cp-send-btn');
                if (input && sendBtn) {
                    input.value = text;
                    sendBtn.click();
                    container.style.opacity = '0';
                    setTimeout(() => container.style.display = 'none', 300);
                }
            });
            container.appendChild(btn);
        });
        
        container.style.display = 'flex';
        // brief timeout to allow display:flex to apply before fading in
        setTimeout(() => {
            container.style.opacity = '1';
        }, 50);
    };

    // Subtle Binary Matrix Rain background (Data Engineering aesthetic)
    (function() {
      const canvas = document.getElementById('matrix-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      
      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const alphabet = "01";
      const fontSize = 16;
      const columns = width / fontSize;
      const rainDrops = [];

      for (let x = 0; x < columns; x++) {
        rainDrops[x] = Math.random() * -100; // staggered entry
      }

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(75, 255, 165, 0.35)'; // match theme color but transparent
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
          const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          const x = i * fontSize;
          const y = rainDrops[i] * fontSize;
          
          if (y > 0) {
            ctx.fillText(text, x, y);
          }

          if (y > height && Math.random() > 0.985) {
            rainDrops[i] = 0;
          }
          rainDrops[i]++;
        }
      }
      setInterval(draw, 33);
    })();

    document.addEventListener('DOMContentLoaded', function() {
      // Seamless Transition Entry Animation
      const transOverlay = document.getElementById('transition-overlay');
      if (transOverlay) {
        // Adjust collapse origin if coming from home layout (button was shifted left to clear socials)
        if (window.location.search.includes('from=home') && window.innerWidth > 720) {
          transOverlay.style.right = '100px';
        }
        // Force repaint
        transOverlay.offsetHeight;
        transOverlay.style.transform = 'scale(0)';
        setTimeout(() => {
          transOverlay.remove();
        }, 700);
      }

      setTimeout(function() {
        const overlay = document.getElementById('command-palette');
        if (overlay) {
          overlay.style.display = 'flex';
          overlay.classList.add('open');
          
          // Show initial chips
          const chips = document.getElementById('cp-agent-chips');
          if (chips) {
              chips.style.display = 'flex';
              chips.style.opacity = '1';
          }

          // Replace default greeting
          const botMsgText = document.querySelector('.cp-message.bot .cp-text');
          if (botMsgText) {
            botMsgText.innerHTML = "<strong>Hello! I am the AI representation of Pavan Badempet, an AI Data Engineer.</strong><br><br>My sole purpose is to prove why he is the perfect fit for your team. What kind of role are you hiring for?";
          }
          
          // Focus input
          const input = document.getElementById('cp-input');
          if (input) input.focus();
        }
      }, 100);
      
      // Bind initial hardcoded chips
      document.querySelectorAll('.agent-chip').forEach(chip => {
        chip.addEventListener('click', function() {
          const input = document.getElementById('cp-input');
          const sendBtn = document.getElementById('cp-send-btn');
          if (input && sendBtn) {
            input.value = this.textContent;
            sendBtn.click();
            const chips = document.getElementById('cp-agent-chips');
            if (chips) {
                chips.style.opacity = '0';
                setTimeout(() => chips.style.display = 'none', 300);
            }
          }
        });
      });
    });
  </script>
</body>
</html>
