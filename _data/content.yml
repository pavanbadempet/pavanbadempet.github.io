### Projects [ team ]
team:
  title: "Projects"
  items:
    - name: "AI Healthcare System"
      role: "Python, PySpark, Databricks, Delta Lake, Airflow, PostgreSQL, Docker, RAG"
      text1: "Designed ETL workflows handling 500K+ healthcare records using Delta Lake Medallion Architecture and SCD Type 2 modeling, optimizing partitioned storage and MERGE operations to reduce runtime by 40%."
      text2: "Delivered FastAPI endpoints and PostgreSQL indexing to lower analytical query latency by 35%, containerized workloads with Docker and scheduled jobs using Airflow DAGs."
      text3: "Implemented a Retrieval Augmented Generation pipeline integrating Cloudflare AI embeddings with a local vector cache, compressing context payload size by 80% and achieving sub-100ms response times."
      architecture_diagram: |
        graph TB
          subgraph Ingestion["INGESTION & LAKEHOUSE"]
            SRC["500K+ Healthcare Records"] --> SPARK["PySpark ETL Jobs"]
            SPARK --> DELTA["Delta Lake (Medallion Architecture)"]
            DELTA --> SCD["SCD Type 2 Dimensions"]
          end
          subgraph Serving["SERVING & RAG API"]
            DELTA --> DB[(PostgreSQL Indexed)]
            DB --> API["FastAPI Backend (Docker)"]
            API --> RAG["RAG Pipeline (Cloudflare AI + Vector Cache)"]
            RAG --> UI["Streamlit Dashboard"]
          end
          classDef modern fill:#1e1e1e,stroke:#4bffa5,stroke-width:2px;
          class SRC,SPARK,DELTA,SCD,DB,API,RAG,UI modern;

    - name: "AI Recommendation Engine"
      role: "Python, PySpark, Databricks, Structured Streaming, Delta Lake, Airflow, FastAPI"
      health_url: "https://movie-recs-api-5qvy.onrender.com/health"
      text1: "Engineered batch and real-time ingestion flows using PySpark, SQL, Structured Streaming on Databricks for 20M+ records, enforcing data quality checks, Delta Lake checkpointing, and incremental loading."
      text2: "Built a low-latency serving API using FastAPI and vector retrieval engine with pgvector/FAISS indexing for candidate matching, enabling sub-50ms lookups across 100K+ items and automated scheduling by GitHub Actions."
      architecture_diagram: |
        graph TB
          subgraph DataPlatform["DATABRICKS STREAMING ENGINE"]
            STREAM["20M+ Event Stream"] --> SPARK["PySpark Structured Streaming"]
            SPARK --> CHECKPOINT["Delta Lake Checkpointing"]
            CHECKPOINT --> DELTA["Delta Lake Gold Store"]
          end
          subgraph VectorEngine["VECTOR RETRIEVAL & SERVING"]
            DELTA --> FAISS["FAISS & pgvector Index (100K+ Items)"]
            FAISS --> API["FastAPI Serving API (<50ms)"]
            API --> GHA["Automated GitHub Actions Scheduling"]
          end
          classDef modern fill:#1e1e1e,stroke:#4bffa5,stroke-width:2px;
          class STREAM,SPARK,CHECKPOINT,DELTA,FAISS,API,GHA modern;

